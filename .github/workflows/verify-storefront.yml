name: Verify Spider's Creations storefront
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog, assets, category selectors, and photo links
        run: python3 scripts/verify_storefront.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Smoke test live customer workflows in a local browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/spiders-server.log 2>&1 &
          sleep 3
          node scripts/browser-smoke.cjs
      - name: Parse all storefront JavaScript
        run: |
          for file in js/search-taxonomy.js js/designs.js js/studio.js js/studio-customize.js js/shop-hub.js js/collection.js js/studio-data.js js/category-images.js store-data.js; do
            node --check "$file"
          done
