name: Import complete Spider's Creations website

on:
  push:
    branches:
      - spiders-storefront-build

permissions:
  contents: write

jobs:
  import-website:
    if: contains(github.event.head_commit.message, '[import-site]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: spiders-storefront-build
          persist-credentials: true
      - name: Download user-approved website release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/spiders-archive"
          gh release download spiders-site-assets --repo "$GITHUB_REPOSITORY" --pattern 'Spiders-Creations-Website-COMPLETE.zip' --dir "$RUNNER_TEMP/spiders-archive"
      - name: Verify and extract complete real image catalog
        run: python3 scripts/import_full_site.py "$RUNNER_TEMP/spiders-archive/Spiders-Creations-Website-COMPLETE.zip"
      - name: Commit the completed site to the preview branch
        run: |
          git config user.name 'Spider Creations Site Importer'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No changes detected'; exit 0; fi
          git commit -m 'Import the complete Spider Creations design catalog and previous storefront'
          git push origin HEAD:spiders-storefront-build
